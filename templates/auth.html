<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionPro | Secure Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Using a high-end abstract dark gradient background */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.7)), 
                        url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-glow:focus {
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
            border-color: #10b981;
        }

        .animate-fade {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="glass-panel p-10 rounded-[2.5rem] w-full max-w-md text-white animate-fade">
        <div class="text-center mb-10">
            <div class="inline-block p-3 rounded-2xl bg-emerald-500/20 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tighter">VISION<span class="text-emerald-400">PRO</span></h1>
            <p id="form-subtitle" class="text-gray-400 text-sm mt-1">Advanced AI Distraction Guard</p>
        </div>

        <h2 id="form-title" class="text-2xl font-bold mb-8 text-center tracking-tight">System Login</h2>

        <form action="/auth" method="POST" class="space-y-5">
            <div id="name-field" class="hidden">
                <label class="block text-xs font-semibold text-emerald-400 uppercase tracking-widest mb-1 ml-1">Full Name</label>
                <input type="text" name="username" placeholder="Enter your name" 
                       class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 outline-none input-glow transition-all text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-emerald-400 uppercase tracking-widest mb-1 ml-1">Email Address</label>
                <input type="email" name="email" placeholder="name@company.com" 
                       class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 outline-none input-glow transition-all text-sm" required>
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-emerald-400 uppercase tracking-widest mb-1 ml-1">Password</label>
                <input type="password" name="password" placeholder="••••••••" 
                       class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 outline-none input-glow transition-all text-sm" required>
            </div>

            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white p-4 rounded-2xl font-bold text-lg shadow-lg shadow-emerald-500/20 transition-all transform active:scale-95">
                <span id="btn-text">Log In</span>
            </button>
        </form>

        <div class="text-center mt-8">
            <p class="text-gray-400 text-sm">
                <span id="toggle-msg">Don't have an account?</span>
                <button onclick="toggleAuth()" id="toggle-btn" class="text-emerald-400 hover:text-emerald-300 font-semibold transition ml-1 underline underline-offset-4">
                    Sign up now
                </button>
            </p>
        </div>
    </div>

    <script>
        let isLogin = true;

        function toggleAuth() {
            isLogin = !isLogin;
            
            const title = document.getElementById('form-title');
            const btnText = document.getElementById('btn-text');
            const toggleMsg = document.getElementById('toggle-msg');
            const toggleBtn = document.getElementById('toggle-btn');
            const nameField = document.getElementById('name-field');

            if (isLogin) {
                title.innerText = "System Login";
                btnText.innerText = "Log In";
                toggleMsg.innerText = "Don't have an account?";
                toggleBtn.innerText = "Sign up now";
                nameField.classList.add('hidden');
            } else {
                title.innerText = "Create Account";
                btnText.innerText = "Register Now";
                toggleMsg.innerText = "Already a member?";
                toggleBtn.innerText = "Log in here";
                nameField.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
